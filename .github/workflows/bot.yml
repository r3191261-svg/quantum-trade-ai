name: Run QUANTUM TRADE AI

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "bot.py"
      - "requirements.txt"
      - "assets/**"
      - ".github/workflows/bot.yml"

concurrency:
  group: quantum-trade-ai-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check required secrets
        env:
          TOKEN_USER: ${{ secrets.TOKEN_USER }}
          TOKEN_ADMIN: ${{ secrets.TOKEN_ADMIN }}
        run: |
          test -n "$TOKEN_USER" || (echo "Missing TOKEN_USER secret" && exit 1)
          test -n "$TOKEN_ADMIN" || (echo "Missing TOKEN_ADMIN secret" && exit 1)

      - name: Run Telegram bots
        env:
          TOKEN_USER: ${{ secrets.TOKEN_USER }}
          TOKEN_ADMIN: ${{ secrets.TOKEN_ADMIN }}
          PYTHONUNBUFFERED: "1"
        run: python bot.py