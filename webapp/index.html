<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050b18">
<title>QUANTUM TRADE AI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}
body{
margin:0;
padding:22px;
font-family:Arial,sans-serif;
color:#fff;
background:radial-gradient(circle at top,#102c58,#050b18 65%);
}
.logo{text-align:center;font-size:27px;font-weight:bold;color:#49b9ff;margin:25px 0}
.subtitle{text-align:center;color:#9bb7d8;margin-bottom:30px}
.card{
padding:22px;margin:14px 0;border-radius:18px;
background:linear-gradient(135deg,#10294a,#10182b);
border:1px solid #237dca;
box-shadow:0 0 18px #0879cc33;
}
button{
width:100%;padding:19px;margin:7px 0;
border:1px solid #278bff;border-radius:14px;
background:linear-gradient(100deg,#0755bd,#087edb);
color:white;font-size:16px;font-weight:bold;
}
button:active{transform:scale(.97)}
h2{color:#50baff}
.info{color:#a8c2df;line-height:1.5}
</style>
</head>

<body>

<div class="logo">⚡ QUANTUM TRADE AI</div>
<div class="subtitle">NEXT GENERATION TRADING PLATFORM</div>

<div class="card">
<h2>Добро пожаловать!</h2>
<p class="info">Интеллектуальная платформа торговых сигналов.</p>
</div>

<button onclick="openSection('БИНАРНЫЕ ОПЦИОНЫ')">⚡ БИНАРНЫЕ ОПЦИОНЫ</button>
<button onclick="openSection('НОВОСТИ')">🌐 НОВОСТИ</button>
<button onclick="openSection('СТАТИСТИКА')">📊 СТАТИСТИКА</button>
<button onclick="openSection('ИСТОРИЯ СИГНАЛОВ')">🕘 ИСТОРИЯ СИГНАЛОВ</button>
<button onclick="openSection('АВТОМАТИЧЕСКИЙ БОТ')">🤖 АВТОМАТИЧЕСКИЙ БОТ</button>
<button onclick="openSection('МОЙ ПРОФИЛЬ')">👤 МОЙ ПРОФИЛЬ</button>
<button onclick="openSection('НАСТРОЙКИ')">⚙️ НАСТРОЙКИ</button>

<div class="card" id="content">
<h2>QUANTUM SYSTEM</h2>
<p class="info">Выбери интересующий раздел.</p>
</div>

<script>
const tg=window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

function openSection(name){
document.getElementById("content").innerHTML=
`<h2>${name}</h2>
<p class="info">Раздел QUANTUM TRADE AI. Подключение данных будет добавлено следующим этапом.</p>
<button onclick="location.reload()">← ГЛАВНОЕ МЕНЮ</button>`;
}
</script>

</body>
</html>
